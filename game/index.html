<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Small Hours</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23ffb347%22/%3E%3Ccircle cx=%2210.5%22 cy=%226.5%22 r=%225%22 fill=%22%231b1630%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="view" width="640" height="360"></canvas>
  <div id="fade"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="clock"><span id="clock-time">9:00</span><span id="clock-ampm">PM</span></div>
    <div id="objective"></div>
    <div id="countdown"><span class="lbl">THE MORNING IN</span><span id="countdown-val">9:14:00</span></div>
    <div id="tickets"></div>
    <div id="hud-buttons">
      <button id="btn-moth" title="Talk to Moth (T)"><span class="moth-dot"></span>Moth</button>
      <button id="btn-map" title="Map (M)">Map</button>
      <button id="btn-journal" title="Journal (J)">Journal<span id="journal-badge" class="hidden">•</span></button>
      <button id="btn-menu" title="Menu (Esc)">≡</button>
    </div>
  </div>
  <div id="hover-label" class="hidden"></div>
  <div id="toast-area"></div>

  <!-- Dialogue -->
  <div id="dialogue" class="hidden">
    <img id="portrait" class="hidden" alt="">
    <div id="box">
      <div id="speaker"></div>
      <div id="line"></div>
      <div id="choices"></div>
      <div id="advance">▼</div>
    </div>
  </div>

  <!-- Overlays -->
  <div id="journal" class="overlay hidden">
    <div class="panel">
      <div class="tabs">
        <button data-tab="people" class="active">People</button>
        <button data-tab="words">Words for the Morning</button>
        <button data-tab="noticed">Noticed</button>
        <button class="close">✕</button>
      </div>
      <div id="journal-body"></div>
    </div>
  </div>

  <div id="map" class="overlay hidden">
    <div id="map-pins"></div>
    <div class="map-title">HALFMOON STREET</div>
    <button class="close">✕</button>
  </div>

  <div id="menu" class="overlay hidden">
    <div class="panel small">
      <h2>Paused</h2>
      <label>Music <input type="range" id="vol-music" min="0" max="100"></label>
      <label>Sound <input type="range" id="vol-sfx" min="0" max="100"></label>
      <label>Text speed <input type="range" id="text-speed" min="0" max="100"></label>
      <button id="menu-resume">Resume</button>
      <button id="menu-title">Save &amp; return to title</button>
    </div>
  </div>

  <div id="name-entry" class="overlay hidden">
    <div class="panel small">
      <p class="dim">Grandma calls you Little Fish. Everyone else calls you&hellip;</p>
      <input id="name-input" maxlength="14" autocomplete="off" spellcheck="false" value="Kit">
      <button id="name-ok">That's me</button>
    </div>
  </div>

  <div id="title" class="hidden">
    <div id="logo">
      <div class="logo-main">SMALL HOURS</div>
      <div class="logo-sub">a night on Halfmoon Street</div>
    </div>
    <div id="title-menu">
      <button id="btn-continue" class="hidden">Continue</button>
      <button id="btn-new">New night</button>
    </div>
    <div id="title-foot">headphones recommended · click or press space to advance</div>
  </div>

  <div id="loading">
    <div class="loading-text">warming the broth&hellip;</div>
    <div id="loading-bar"><div></div></div>
  </div>

  <div id="click-to-start" class="hidden"><div>click to begin</div></div>

  <div id="epilogue" class="hidden"><div id="epilogue-inner"></div></div>
</div>
<script src="js/vendor/ink.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
